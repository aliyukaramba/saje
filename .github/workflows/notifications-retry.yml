name: Notification outbox retry

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Retry pending notification events
        if: ${{ secrets.NOTIFICATION_CRON_SECRET != '' }}
        env:
          SAJE_API_URL: ${{ vars.SAJE_API_URL || 'https://saje-web.akarambaaleeyu.workers.dev' }}
          NOTIFICATION_CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${NOTIFICATION_CRON_SECRET}" \
            "${SAJE_API_URL%/}/api/notifications/dispatch"
