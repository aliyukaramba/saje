name: CI

# Runs the same checks that Cloudflare runs, before a change reaches the live site.
# It does not deploy: Workers Builds still deploys dev on push.
on:
  push:
    branches: [dev, staging, deps-upgrade, remaining-work]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install staff mobile dependencies
        run: npm install --no-audit --no-fund --package-lock=false
        working-directory: apps/staff-mobile

      - name: Type check staff mobile
        run: npm run typecheck
        working-directory: apps/staff-mobile

      - name: Generate Prisma client
        run: npm run generate -w @restaurant/database

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Cloudflare build
        # The build does not connect to the database, so a placeholder URL is enough here.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
        run: npm run build:cf -w @restaurant/web
